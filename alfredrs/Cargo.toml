[package]
name = "alfredrs"
version = "0.1.0"
edition = "2021"
description = "Alfred-inspired keyboard launcher for Linux, written in Rust"
license = "MIT"
readme = "README.md"
keywords = ["launcher", "alfred", "productivity", "search"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "alfredrs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
eframe = "0.31"
egui = "0.31"
fuzzy-matcher = "0.3"
global-hotkey = "0.8"
meval = "0.2"
open = "5.4"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"
urlencoding = "2.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.27"
